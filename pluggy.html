<!-- POULER FINANCE | Vincular duas ou mais receitas a uma transferência única -->
<style>
.pf-soma{margin:16px 0;border:1px solid #dcd0ef;border-radius:18px;background:#fff;padding:18px}
.pf-soma h3{margin:0 0 7px;font-size:18px;color:#2c2246}
.pf-soma p{margin:5px 0 14px;color:#746d83;font-size:13px;line-height:1.5}
.pf-soma-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pf-soma-field{min-width:0}.pf-soma-field label{display:block;color:#615776;font-size:12px;font-weight:750;margin:0 0 6px}
.pf-soma-field .select{width:100%;max-width:100%;min-width:0}
.pf-soma-candidate{border:1px solid #e9e2f2;border-radius:12px;margin:7px 0;display:flex;gap:10px;align-items:center;padding:11px;cursor:pointer}
.pf-soma-candidate:has(input:checked){background:#f2ecfc;border-color:#9878df}
.pf-soma-candidate input{width:17px;height:17px;flex-shrink:0;accent-color:#7952d2}
.pf-soma-candidate span{min-width:0;flex:1}.pf-soma-candidate strong{display:block;font-size:13px;overflow-wrap:anywhere}
.pf-soma-candidate small{display:block;color:#70687d;font-size:11px;margin-top:2px}
.pf-soma-candidate b{white-space:nowrap;font-size:13px;color:#0c9369}
.pf-soma-total{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#f5f0ff;border:1px solid #e3d6f6;border-radius:12px;padding:12px;margin:12px 0}
.pf-soma-total b{font-size:16px}.pf-soma-ok{color:#067e5d}.pf-soma-no{color:#b45c32}
.pf-soma-hints{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pf-soma-hints .btn{border-radius:99px}
.pf-soma-note{background:#f6f8fc;border-radius:10px;padding:10px 12px;color:#6e6780;font-size:12px;margin:12px 0}
.pf-soma-history{margin-top:16px;border-top:1px solid #eee7f7;padding-top:14px}
.pf-soma-history-row{padding:10px 0;border-bottom:1px solid #eee7f7;display:flex;gap:12px;align-items:center;justify-content:space-between}
.pf-soma-history-row small{display:block;font-size:11px;color:#70657c;margin-top:4px;overflow-wrap:anywhere}
@media(max-width:700px){.pf-soma{padding:13px}.pf-soma-grid{grid-template-columns:1fr}.pf-soma-history-row{flex-wrap:wrap}.pf-soma-candidate{gap:7px}}
</style>
<script>
(() => {
  if (window.__pfSomaVinculoV1) return;
  window.__pfSomaVinculoV1 = true;
  const cents = x => Math.round(Math.abs(Number(x)||0)*100);
  const isoDate = t => String(t?.date||'').slice(0,10);
  const day = t => Date.parse(isoDate(t)+'T12:00:00Z');
  const recordKey = () => 'recon-origin:'+ (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  let chosenOut = '';
  let selectedSources = new Set();
  let chosenDest = '';
  function tx(id) { return transactions().find(t => txKey(t) === id); }
  function linkedOrigins() {
    const result = [];
    for (const [key, rec] of Object.entries(state().overrides||{})) {
      if (!key.startsWith('recon-origin:') || typeof rec?.note !== 'string') continue;
      try {
        const obj = JSON.parse(rec.note);
        if (typeof obj.out === 'string' && Array.isArray(obj.sources)) result.push({key,...obj});
      } catch {}
    }
    return result;
  }
  function isEligibleOut(t){
    return !!t && isBank(t) && signed(t)<0 && !['cardpayment','ignore'].includes(annotation(t).kind);
  }
  function sourcesFor(out){
    if(!isEligibleOut(out)) return [];
    const used = new Set(linkedOrigins().filter(r=>r.out!==txKey(out)).flatMap(r=>r.sources));
    const when = day(out);
    return transactions().filter(t=>
      t.accountId===out.accountId && signed(t)>0 && annotation(t).kind==='normal' &&
      !used.has(txKey(t)) && Number.isFinite(day(t)) &&
      day(t)<=when && when-day(t)<=14*86400000
    ).sort((a,b)=>isoDate(b).localeCompare(isoDate(a))||cents(signed(b))-cents(signed(a)));
  }
  function totalSelected(){return [...selectedSources].reduce((s,id)=>s+cents(signed(tx(id))),0);}
  function sourceLabel(t){return `${fmtDate(t.date)} · ${currency(Math.abs(signed(t)))} · ${annotation(t).title}`;}
  function suggestedSums(out, candidates) {
    const target = cents(signed(out));
    const rows = candidates.filter(t=>cents(signed(t))>0 && cents(signed(t))<=target).slice(0,24);
    const answers=[];let examined=0;
    function walk(index,combo,sum){
      if(answers.length>=3 || examined>32000) return;
      examined++;
      if(combo.length>=2 && sum===target){ answers.push(combo.slice()); return; }
      if(combo.length>=4 || sum>=target) return;
      for(let i=index;i<rows.length;i++){
        const v=cents(signed(rows[i]));
        if(v+sum>target) continue;
        combo.push(txKey(rows[i]));walk(i+1,combo,sum+v);combo.pop();
        if(answers.length>=3 || examined>32000)break;
      }
    }
    walk(0,[],0);
    return answers;
  }
  function possibleDestinations(out){
    if(!out) return [];
    const used=reconPairedIds(), paired=reconRecords().find(p=>p.from===txKey(out));
    if(paired) return [];
    return transactions().filter(t=>
      isBank(t) && signed(t)>0 && !used.has(txKey(t)) &&
      reconValidPair(out,t) &&
      annotation(t).kind!=='ignore' && annotation(t).kind!=='cardpayment'
    ).sort((a,b)=>Number(/sicoob/i.test(reconAccountBank(b)))-Number(/sicoob/i.test(reconAccountBank(a))));
  }
  function sourceRecord(out){return linkedOrigins().find(x=>x.out===txKey(out));}
  function outputSelect(){
    const outs=transactions().filter(isEligibleOut).sort((a,b)=>isoDate(b).localeCompare(isoDate(a)));
    return `<option value="">Selecione uma saída (ex.: PIX de R$ 205 do Inter)</option>`+
      outs.map(t=>`<option value="${esc(txKey(t))}" ${chosenOut===txKey(t)?'selected':''}>${esc(fmtDate(t.date)+' · '+bankLabel(account(t.accountId))+' · '+currency(Math.abs(signed(t)))+' · '+annotation(t).title.slice(0,45))}</option>`).join('');
  }
  function editor(){
    const out=tx(chosenOut);
    if(!out) return `<div class="pf-soma-note">Selecione primeiro a transferência que saiu do Inter. O sistema procurará recebimentos anteriores na mesma conta para verificar a soma.</div>`;
    const found=sourcesFor(out);
    const current=sourceRecord(out);
    if(current) return `<div class="pf-soma-note">Esta saída já possui uma composição salva. Para refazê-la, desfaça o vínculo na lista abaixo e selecione novamente.</div>`;
    const suggestion=suggestedSums(out,found);
    const target=cents(signed(out)),total=totalSelected(),difference=target-total;
    const paired=reconRecords().find(r=>r.from===txKey(out));
    const dest=possibleDestinations(out);
    if(chosenDest&&!dest.some(t=>txKey(t)===chosenDest)) chosenDest='';
    return `
      <div class="pf-soma-note"><b>Saída escolhida:</b> ${esc(reconTxLabel(out))}<br>Somente recebimentos reais. Não selecione transferências entre suas contas, empréstimos ou estornos.</div>
      <div class="pf-soma-hints">${suggestion.length?`<small style="width:100%;color:#5e5378">Sugestões de somas exatas (clique para selecionar):</small>`+suggestion.map((ids,i)=>`<button type="button" class="btn sm" data-pf-soma-suggest="${i}">${ids.map(id=>currency(Math.abs(signed(tx(id))))).join(' + ')} = ${currency(target/100)}</button>`).join(''):`<small>Nenhuma soma exata encontrada entre os recebimentos recentes. Você pode selecionar manualmente.</small>`}</div>
      <div style="max-height:285px;overflow:auto;margin:12px 0" role="group" aria-label="Recebimentos que compõem a saída">
      ${found.length?found.map(t=>`<label class="pf-soma-candidate"><input type="checkbox" data-pf-soma-source="${esc(txKey(t))}" ${selectedSources.has(txKey(t))?'checked':''}><span><strong>${esc(annotation(t).title)}</strong><small>${esc(fmtDate(t.date))} · ${esc(bankLabel(account(t.accountId)))}</small></span><b>${currency(Math.abs(signed(t)))}</b></label>`).join(''):'<div class="pf-soma-note">Nenhum recebimento disponível nesse banco nos 14 dias anteriores à saída. Se estiver em outro mês, a consulta atual não o trouxe.</div>'}
      </div>
      <div class="pf-soma-total"><span>Saída: <b>${currency(target/100)}</b></span><span>Recebimentos selecionados: <b>${currency(total/100)}</b></span><span class="${difference===0&&selectedSources.size>=2?'pf-soma-ok':'pf-soma-no'}">${difference===0&&selectedSources.size>=2?'✓ Soma confere':difference>0?'Faltam '+currency(difference/100):'Excesso de '+currency(-difference/100)}</span></div>
      <div class="pf-soma-field"><label for="pf-soma-dest">Entrada correspondente no Sicoob (opcional)</label>
      ${paired?`<div class="pf-soma-note">✓ Esta saída já está conciliada com ${esc(paired.toBank||'outra conta')}. O vínculo servirá apenas para identificar quais aulas formaram os R$ ${esc((target/100).toFixed(2))}.</div>`:
      `<select class="select" id="pf-soma-dest"><option value="">Ainda não encontrei o crédito no Sicoob (registrar só a origem)</option>${dest.map(t=>`<option value="${esc(txKey(t))}" ${chosenDest===txKey(t)?'selected':''}>${esc(reconTxLabel(t))}</option>`).join('')}</select>`}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px"><button type="button" class="btn primary" data-pf-soma-save ${selectedSources.size<2||selectedSources.size>6||difference!==0?'disabled':''}>✓ Vincular a soma à transferência</button><small style="color:#756983">Mínimo 2 e máximo 6 recebimentos. Você confirma antes de salvar.</small></div>`;
  }
  function history(){
    const records=linkedOrigins().filter(r=>tx(r.out)||r.month===period());
    if(!records.length) return '<div class="pf-soma-note">Ainda não há transferências com origem identificada neste mês.</div>';
    return records.map(r=>{
      const out=tx(r.out),receipts=r.sources.map(tx).filter(Boolean);
      const name=out?reconTxLabel(out):`Transferência registrada em ${esc(r.month||'outro mês')}`;
      const detail=receipts.length?receipts.map(t=>`${currency(Math.abs(signed(t)))} · ${annotation(t).title}`).join(' + '):`${r.sources.length} recebimentos vinculados`;
      return `<div class="pf-soma-history-row"><div><strong>${esc(name)}</strong><small>Composto por: ${esc(detail)}</small><small>Receitas originais continuam como proventos. ${reconRecords().some(p=>p.from===r.out)?'Entrada na outra conta conciliada.':'Destino ainda sem par confirmado.'}</small></div><button type="button" class="btn sm danger" data-pf-soma-undo="${esc(r.key)}">Desfazer vínculo</button></div>`;
    }).join('');
  }
  function panel(){
    return `<section class="pf-soma" id="pf-soma-panel"><div class="over">NOVA CONCILIAÇÃO · COMPOSIÇÃO DE VALORES</div><h3>⇄ Somar PIX de aulas e vincular à transferência</h3>
    <p>Exemplo: R$ 125 + R$ 80 recebidos no <b>Inter</b> formam R$ 205 enviados ao <b>Sicoob</b>. O painel identifica a origem desse dinheiro, sem apagar as duas receitas.</p>
    <div class="pf-soma-field"><label for="pf-soma-out">1. Qual transferência você fez?</label><select class="select" id="pf-soma-out">${outputSelect()}</select></div>
    <div id="pf-soma-editor">${editor()}</div>
    <div class="pf-soma-history"><strong>Composições já confirmadas</strong><div id="pf-soma-history-content">${history()}</div></div></section>`;
  }
  const previousPage=reconciliationPage;
  reconciliationPage=function(...args){
    const html=previousPage(...args);
    const needle='<div class="card rec-panel"><div class="rec-head"><div><h3>03 · Transferências já conciliadas';
    return html.includes(needle) ? html.replace(needle,panel()+needle) : html+panel();
  };
  const root=document.getElementById('view-content');
  if(!root)return;
  root.addEventListener('change',e=>{
    if(currentView!=='conciliacao')return;
    if(e.target.id==='pf-soma-out') {chosenOut=e.target.value;chosenDest='';selectedSources=new Set();document.getElementById('pf-soma-editor').innerHTML=editor();return;}
    if(e.target.id==='pf-soma-dest'){chosenDest=e.target.value;return;}
    if(e.target.matches('[data-pf-soma-source]')){
      const id=e.target.dataset.pfSomaSource;
      if(e.target.checked) selectedSources.add(id);else selectedSources.delete(id);
      // Atualiza apenas o editor; os dados originais continuam intactos.
      document.getElementById('pf-soma-editor').innerHTML=editor();
    }
  });
  root.addEventListener('click',e=>{
    if(currentView!=='conciliacao')return;
    const btn=e.target.closest('button');if(!btn)return;
    if(btn.hasAttribute('data-pf-soma-suggest')){
      const out=tx(chosenOut);if(!out)return;
      const choices=suggestedSums(out,sourcesFor(out));
      selectedSources=new Set(choices[Number(btn.dataset.pfSomaSuggest)]||[]);
      document.getElementById('pf-soma-editor').innerHTML=editor();return;
    }
    if(btn.hasAttribute('data-pf-soma-save')){
      const out=tx(chosenOut),ids=[...selectedSources],sources=ids.map(tx);
      const others=linkedOrigins().filter(r=>r.out!==chosenOut);
      if(!isEligibleOut(out)||ids.length<2||ids.length>6||sources.some(t=>!t)||new Set(ids).size!==ids.length||
          sources.some(t=>!sourcesFor(out).some(x=>txKey(x)===txKey(t)))||
          others.some(r=>ids.some(id=>r.sources.includes(id)))||
          sources.reduce((s,t)=>s+cents(signed(t)),0)!==cents(signed(out))) {
        notice('Revise a seleção: escolha 2 a 6 recebimentos válidos que somem exatamente a saída.','warn');return;
      }
      if(sourceRecord(out)){notice('Essa saída já tem uma origem vinculada. Desfaça primeiro.','warn');return;}
      const paired=reconRecords().find(p=>p.from===chosenOut);
      const dest=paired?null:tx(chosenDest);
      if(dest&&(!reconValidPair(out,dest)||reconPairedIds().has(txKey(dest))||reconPairedIds().has(chosenOut))) {
        notice('A entrada no Sicoob não corresponde à saída ou já está conciliada.','warn');return;
      }
      const detail=sources.map(t=>currency(Math.abs(signed(t)))).join(' + ');
      if(!confirm(`Confirmar composição de receitas?\n\n${detail} = ${currency(Math.abs(signed(out)))}\n\nAs receitas originais permanecem contabilizadas. A saída do Inter será marcada como transferência própria.${dest?' A entrada correspondente no Sicoob também será conciliada.':''}\n\nConfirme apenas se o dinheiro foi transferido entre contas suas.`))return;
      const previous=annotation(out);
      const note=JSON.stringify({out:chosenOut,sources:ids,amount:Math.abs(signed(out)),month:period(),prevKind:previous.kind,prevInclude:previous.includeFree});
      if(note.length>500){notice('Muitos identificadores para salvar neste vínculo. Selecione menos recebimentos.','warn');return;}
      const key=recordKey();
      state().overrides[key]={title:'Origem da transferência (soma de receitas)',category:'Transferências internas',kind:'ignore',note};
      state().overrides[chosenOut]={...previous,kind:'transfer',includeFree:false};
      if(dest){
        const a=previous,b=annotation(dest);
        state().overrides[txKey(dest)]={...b,kind:'transfer',includeFree:false};
        const pairKey='recon:'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
        state().overrides[pairKey]={title:'Transferência interna conciliada',kind:'transfer',note:JSON.stringify({from:chosenOut,to:txKey(dest),fromBank:reconAccountBank(out).slice(0,50),toBank:reconAccountBank(dest).slice(0,50),amount:Math.abs(signed(out)),sourceIncluded:!!a.includeFree,destIncluded:!!b.includeFree,sourceKind:a.kind,destKind:b.kind})};
      }
      selectedSources=new Set();chosenOut='';chosenDest='';scheduleSave();
      notice('Receitas agrupadas e transferência identificada. Os PIX de aulas continuam como proventos.','good');return;
    }
    if(btn.hasAttribute('data-pf-soma-undo')){
      const record=linkedOrigins().find(r=>r.key===btn.dataset.pfSomaUndo);if(!record)return;
      if(!confirm('Desfazer apenas a composição das receitas? Uma conciliação bancária já confirmada será mantida.'))return;
      const hasPair=reconRecords().some(p=>p.from===record.out);
      if(!hasPair){
        const out=tx(record.out);
        const old=state().overrides[record.out]||{};
        state().overrides[record.out]={...old,kind:record.prevKind||'normal',includeFree:!!record.prevInclude};
      }
      delete state().overrides[record.key];
      chosenOut='';selectedSources=new Set();chosenDest='';scheduleSave();
      notice('Vínculo desfeito. As receitas originais não foram alteradas.','good');return;
    }
  });
  // Desfazer o par bancário não deve desfazer a origem da transferência.
  const previousUndo=reconUndoPair;
  reconUndoPair=function(key){
    const pair=reconRecords().find(p=>p.key===key);
    previousUndo(key);
    if(pair&&!reconRecords().some(p=>p.key===key)&&linkedOrigins().some(r=>r.out===pair.from)){
      const old=state().overrides[pair.from]||{};
      state().overrides[pair.from]={...old,kind:'transfer',includeFree:false};
      scheduleSave();
    }
  };
  if(currentView==='conciliacao')render();
})();
</script>
